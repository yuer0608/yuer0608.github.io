<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>罗玉姣的个人主页</title>
  <meta name="description" content="罗玉姣的个人信息主页和旅游行程列表">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <aside class="left-panel" aria-label="个人信息和菜单">
      <section class="profile-card">
        <div class="profile-mark">罗</div>
        <p class="eyebrow">个人主页</p>
        <h1>罗玉姣</h1>
        <p class="profile-line">女</p>
        <p class="profile-note">把旅行计划、家庭安排和日常信息放在一个清爽的主页里。</p>
      </section>

      <nav class="side-menu" aria-label="主菜单">
        <button class="menu-item is-active" type="button" data-menu="travel">
          <span>旅游</span>
          <small>行程列表</small>
        </button>
      </nav>
    </aside>

    <section class="middle-panel" aria-labelledby="middle-title">
      <div class="panel-heading">
        <p class="eyebrow" id="middle-kicker">Travel Plans</p>
        <h2 id="middle-title">旅游行程列表</h2>
        <p>从左侧菜单进入旅游模块，在这里选择一条旅行记录，右侧会展示完整行程细节。</p>
      </div>
      <div class="trip-list" id="trip-list" aria-live="polite"></div>
    </section>

    <aside class="right-panel" id="detail-panel" aria-live="polite" aria-label="个人信息和行程详情">
      <section class="empty-detail">
        <p class="eyebrow">Profile</p>
        <h2>罗玉姣</h2>
        <div class="info-grid">
          <div><span>姓名</span><strong>罗玉姣</strong></div>
          <div><span>性别</span><strong>女</strong></div>
        </div>
        <p>点击中间的杭州行程卡片后，这里会切换为完整旅游行程详情。</p>
      </section>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
