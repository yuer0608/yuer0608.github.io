<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>罗玉姣的个人主页</title>
  <meta name="description" content="罗玉姣的个人信息主页和旅游行程列表">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell">
    <aside class="profile-sidebar" aria-label="个人信息和旅游菜单">
      <section class="profile-card">
        <div class="avatar-badge" aria-hidden="true">罗</div>
        <p class="kicker">Cute Home</p>
        <h1>罗玉姣</h1>
        <p class="gender-pill">女</p>
        <p class="profile-copy">一个放个人信息和旅行计划的小主页，软软糯糯，可爱一点。</p>
      </section>

      <section class="side-card">
        <p class="side-title">旅游菜单</p>
        <button class="side-trip is-active" type="button" data-view-target="list">
          <span>杭州五一亲子 2 天 1 夜</span>
          <small>点击中间卡片看完整行程</small>
        </button>
      </section>
    </aside>

    <main class="content-panel" aria-live="polite">
      <nav class="top-tabs" aria-label="页面切换菜单">
        <button class="top-tab is-active" type="button" data-view-target="profile">个人信息</button>
        <button class="top-tab" type="button" data-view-target="list">旅游列表</button>
        <button class="top-tab" type="button" data-view-target="trip">杭州行程</button>
      </nav>

      <section class="view is-active" id="view-profile" data-view="profile">
        <div class="home-hero">
          <span class="sticker">hello</span>
          <p class="kicker">Personal Page</p>
          <h2>罗玉姣的小主页</h2>
          <p>这里先简单放个人信息，也可以从上面的菜单切换到旅游列表，再进入杭州亲子行程。</p>
          <div class="info-grid">
            <div><span>姓名</span><strong>罗玉姣</strong></div>
            <div><span>性别</span><strong>女</strong></div>
          </div>
        </div>
      </section>

      <section class="view" id="view-list" data-view="list">
        <div class="list-heading">
          <p class="kicker">Trip List</p>
          <h2>旅游行程列表</h2>
          <p>目前只有一条杭州行程。点击卡片后，中间区域会切换成原始行程页面的完整展示。</p>
        </div>

        <button class="trip-card" type="button" data-view-target="trip">
          <div class="trip-card-main">
            <span class="trip-tag">五一亲子自驾</span>
            <h3>杭州五一亲子 2 天 1 夜行程</h3>
            <p>小河直街、拱宸桥水上巴士、胜利河美食街、湘湖森泊幻想岛和龙坞茶山。</p>
          </div>
          <div class="trip-card-meta">
            <span>5/3-5/4</span>
            <span>一家三口</span>
            <span>约 1,760-1,840 元</span>
          </div>
        </button>
      </section>

      <section class="view trip-view" id="view-trip" data-view="trip">
        <div class="trip-toolbar">
          <button class="back-button" type="button" data-view-target="list">返回旅游列表</button>
          <a href="hangzhou-family-trip.html" target="_blank" rel="noopener">新窗口打开</a>
        </div>
        <iframe class="trip-frame" title="杭州五一亲子 2 天 1 夜行程单" src="hangzhou-family-trip.html"></iframe>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
